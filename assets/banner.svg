<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-bright" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes carMove {
        0% { transform: translateX(0px); }
        50% { transform: translateX(180px); }
        100% { transform: translateX(0px); }
      }
      @keyframes signalWave {
        0% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.1); }
        100% { opacity: 0.2; transform: scale(0.8); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(500px); }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animated-bg-circle {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-car {
        animation: carMove 8s ease-in-out infinite;
      }
      .animated-signal {
        animation: signalWave 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-icon {
        animation: floatDot 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="100" r="180" fill="#0284c7" filter="url(#glow-bright)" class="animated-bg-circle" />
  <circle cx="1050" cy="300" r="200" fill="#6366f1" filter="url(#glow-bright)" class="animated-bg-circle" style="animation-delay: -3s;" />

  <!-- Abstract Parking Spot Grid & Vehicle Graphics on Right -->
  <g transform="translate(720, 60)">
    <!-- Parking Bays -->
    <rect x="0" y="0" width="400" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.8" />
    
    <!-- Bay Lines -->
    <line x1="133" y1="20" x2="133" y2="260" stroke="#475569" stroke-width="3" stroke-dasharray="8,8" />
    <line x1="266" y1="20" x2="266" y2="260" stroke="#475569" stroke-width="3" stroke-dasharray="8,8" />

    <!-- Spot Status Indicators -->
    <!-- Spot 1: Occupied -->
    <rect x="20" y="30" width="93" height="100" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <text x="66" y="55" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OCCUPIED</text>
    <!-- Car Graphic 1 -->
    <rect x="35" y="65" width="63" height="50" rx="10" fill="#ef4444" opacity="0.8" />
    <rect x="45" y="73" width="43" height="20" rx="4" fill="#0f172a" />

    <!-- Spot 2: Reserved -->
    <rect x="153" y="30" width="93" height="100" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="200" y="55" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RESERVED</text>
    <circle cx="200" cy="90" r="16" fill="#f59e0b" opacity="0.2" />
    <path d="M194 90 L200 84 L206 90 M200 84 V96" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Spot 3: Available (Animated Car entering) -->
    <rect x="286" y="30" width="93" height="100" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="333" y="55" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VACANT</text>
    <circle cx="333" cy="90" r="18" fill="#10b981" class="animated-signal" />
    <text x="333" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">P</text>

    <!-- Bottom Moving Vehicle Lane -->
    <rect x="20" y="160" width="360" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="40" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SMART ACCESS &amp; LPR GATE</text>

    <!-- Moving Car -->
    <g class="animated-car">
      <rect x="30" y="195" width="80" height="40" rx="8" fill="url(#pill-grad)" filter="url(#glow)" />
      <rect x="50" y="200" width="40" height="18" rx="4" fill="#38bdf8" opacity="0.6" />
      <circle cx="48" cy="235" r="5" fill="#f8fafc" />
      <circle cx="92" cy="235" r="5" fill="#f8fafc" />
    </g>

    <!-- Gate Barrier -->
    <rect x="240" y="175" width="6" height="60" fill="#ef4444" rx="2" />
    <rect x="246" y="185" width="70" height="6" fill="#f8fafc" rx="2" transform="rotate(-15 246 185)" />
  </g>

  <!-- Left Content / Branding Area -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 75)">
      <rect width="270" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="18" cy="17" r="6" fill="#38bdf8" class="animated-signal" />
      <text x="34" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">PARKING ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Parking
    </text>
    <text x="0" y="210" fill="url(#accent-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Management Systems
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="255" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" width="550">
      Curated PARCS Platforms, Open-Source Software, LPR Vision &amp; SaaS Solutions
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="65" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚗 PARCS &amp; Access</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="205" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💳 Mobile Payments</text>

      <!-- Pill 3 -->
      <rect x="280" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="345" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📷 LPR &amp; Vision</text>
    </g>
  </g>
</svg>
